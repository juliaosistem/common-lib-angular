name: Publicar en npm con Auto-Version


on:
  push:
    branches:
      - master
    # Evita que el workflow se ejecute en ramas de release
    # Solo ejecuta en master, no en release-auto-*
    # Si necesitas permitir otros triggers, agrégalos aquí

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # 🔐 IMPORTANTE: Permiso de escritura necesario para hacer git push
    permissions:
      contents: write  # Necesario para 'git push' (npm version)
      id-token: write  # NECESARIO para 'npm publish --provenance' (OIDC)

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4
        with:
          # Necesitamos el historial completo y el token para hacer push
          fetch-depth: 0 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Configura Git
        run: |
          git config --global user.email "zigmainflables@gmail.com"
          git config --global user.name "Daniel Juliao"
      
      - name: Clona lib-core-dtos (Dependencia Privada)
        run: |
          rm -rf lib-core-dtos
          if [ -n "${{ secrets.LIB_CORE_DTOS_PAT }}" ]; then
            echo "🔐 Clonando lib-core-dtos con token secreto"
            git clone --depth 1 https://x-access-token:${{ secrets.LIB_CORE_DTOS_PAT }}@github.com/juliaosistem/lib-core-dtos.git lib-core-dtos
          else
            echo "⚠️ secrets.LIB_CORE_DTOS_PAT no configurado."
            git clone --depth 1 https://github.com/juliaosistem/lib-core-dtos.git lib-core-dtos || echo "Fallo clonación pública."
          fi

      - name: Instala las dependencias
        run: npm ci

      - name: Genera DTOs
        run: npm run generate:dtos
        # NOTA: Si este paso modifica archivos rastreados por git, 
        # 'npm version' fallará porque el directorio no estará limpio.
        # Asegúrate de que los archivos generados estén en .gitignore.



      - name: Incrementa versión (patch)
        run: |
          echo "🆙 Incrementando versión (patch)..."
          git config --global user.email "zigmainflables@gmail.com"
          git config --global user.name "Daniel Juliao"
          echo "📂 Estado de Git antes de versionar:"
          git status -s
          npm version patch --force -m "chore(release): %s [skip ci]"
          
      - name: Sincronizar versión con la librería
        run: |
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "Nueva versión detectada: $NEW_VERSION"
            
            # Actualizar version en projects/lib-common-angular/package.json
            cd projects/lib-common-angular
            npm version $NEW_VERSION --no-git-tag-version --allow-same-version
            cd ../..
            
            # Commit de la sincronización para que quede en el repo
            git add projects/lib-common-angular/package.json
            git commit --amend --no-edit || echo "No hubo cambios en el sub-package.json para commitear"


      - name: Build
        run: npm run build:lib

      # - name: Copia package.json corregido a dist/lib-common-angular
      #   run: cp package.json dist/lib-common-angular/package.json

      - name: Publica en npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          echo "📦 Publicando en npm..."
          npm run publish:npm
          echo "✅ Publicación completada."

      - name: Crea rama y PR de release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=release-auto-${{ github.run_id }}
          git checkout -b $BRANCH
          git push origin $BRANCH --follow-tags
          echo "🔀 Creando Pull Request hacia master..."
          gh pr create --base master --head $BRANCH --title "Release auto ${{ github.run_id }}" --body "Release generado automáticamente por CI"
          echo "ℹ️ Espera la aprobación y merge del PR para completar el release."

      - name: Notify Jenkins (al final)
        if: always()
        run: |
          echo "🔄 Jenkins Multibranch será notificado (post-publicación)"
          echo "📦 Rama: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          if [ -n "${{ secrets.JENKINS_URL }}" ]; then
            echo "📣 Enviando notifyCommit a Jenkins: ${{ secrets.JENKINS_URL }}"
            curl -sS -X POST "${{ secrets.JENKINS_URL }}/git/notifyCommit?url=${{ github.server_url }}/${{ github.repository }}" || true
          else
            echo "ℹ️ secrets.JENKINS_URL no está definido; omitiendo webhook"
          fi

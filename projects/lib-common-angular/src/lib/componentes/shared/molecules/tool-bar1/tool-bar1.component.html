<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <div class="flex items-center gap-2">
      <lib-button-options-table 
      [isAdd]="showDropdownAddButton"
        (onAdd)="onNewItem()"
        [isDelete]="showDropdownDeleteButton"
        (onDelete)="onDeleteSelected()"
        (onExportExcel)="onExportToExcel()">
      </lib-button-options-table>
      @if (showAddButton) {
        <lib-button-add1 
          [testId]="testIdPrefix + '-add-button'"
          (add)="onNewItem()">
        </lib-button-add1>
      }
      @if (shouldShowDeleteButton) {
        <lib-button-delete1 
          [testId]="testIdPrefix + '-delete-button'"
          (delete)="onDeleteSelected()">
        </lib-button-delete1>
      }
    </div>
  </ng-template>

  <ng-template #end>
    <lib-view-buttons-container1 
      [currentView]="currentView" 
      (viewChange)="onViewChange($event)" />
  </ng-template>
</p-toolbar>

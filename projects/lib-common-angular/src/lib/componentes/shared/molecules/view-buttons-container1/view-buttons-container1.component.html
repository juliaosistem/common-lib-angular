<p-selectbutton
  [(ngModel)]="value"
  [options]="stateOptions"
  optionLabel="label"
  optionValue="value"
  [allowEmpty]="false"
>
  <ng-template pTemplate="item" let-item>
    @if (item.value === 'table') {
      <span>
        <lib-button-table-view1></lib-button-table-view1>
      </span>
    } @else if (item.value === 'grid') {
      <span>
        <lib-button-card-view1></lib-button-card-view1>
      </span>
    }
  </ng-template>
</p-selectbutton>
